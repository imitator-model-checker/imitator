name: workflow

on:
  push:
    branches:
      - develop
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - macos-latest
    runs-on: ${{ matrix.os }}
    env:
      MAX_ALLOWED_TEST_FAILURES: 0
    steps:
      # setup repository
      - name: Checkout
        uses: actions/checkout@v4

      # cache the opam root (compiler switch + OCaml libs + mlgmp/PPL bindings)
      - name: Cache opam
        uses: actions/cache@v4
        with:
          path: ~/.opam
          key: opam-${{ matrix.os }}-ocaml4.14.2-${{ hashFiles('.github/scripts/install-deps.sh', '.github/scripts/install-mlgmp.sh', '.github/scripts/install-ppl.sh') }}
          restore-keys: |
            opam-${{ matrix.os }}-ocaml4.14.2-

      # install dependencies
      - name: Install dependencies
        run: .github/scripts/install-deps.sh
        shell: bash

      # build IMITATOR
      - name: Run build
        run: .github/scripts/build.sh
        shell: bash

      # run dune tests
      - name: Run dune tests
        run: |
          eval "$(opam env --switch=imitator)"
          dune runtest
        shell: bash

      # run tests
      - name: Run and check tests
        run: |
          python tests/test.py
          python .github/scripts/check_test_results.py \
            --max-failures "$MAX_ALLOWED_TEST_FAILURES"
        shell: bash

      # build documentation
      - name: Documentation
        run: .github/scripts/documentation.sh
        shell: bash

      # prepare artifacts
      - name: Prepare artifact
        if: github.event_name == 'push'
        run: .github/scripts/prepare-artifact.sh
        shell: bash

      # upload artifacts
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: imitator-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 7
          path: |
            bin/*
            doc/user-guide/IMITATOR-user-manual.pdf
            doc/developer-manual/IMITATOR-developer-manual.pdf

  deploy:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    name: Publish - Github Release
    runs-on: ubuntu-22.04
    needs: build
    permissions:
      contents: write
    steps:
      # retrieve information
      - name: Retrieve artifacts
        uses: actions/download-artifact@v4

      # deploy
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            imitator-macos-*/bin/*
            imitator-ubuntu-*/bin/*
            imitator-ubuntu-*/doc/user-guide/IMITATOR-user-manual.pdf
            imitator-ubuntu-*/doc/developer-manual/IMITATOR-developer-manual.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/develop')
    name: Publish - Docker Hub
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: imitator/imitator
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            IMITATOR_GIT_HASH=${{ github.sha }}
            IMITATOR_GIT_BRANCH=${{ github.ref_name }}
          cache-from: |
            type=gha,scope=docker-${{ hashFiles('Dockerfile', '.github/scripts/install-deps.sh', '.github/scripts/install-mlgmp.sh', '.github/scripts/install-ppl.sh', '.github/patches/**') }}
            type=gha
          cache-to: type=gha,mode=max,scope=docker-${{ hashFiles('Dockerfile', '.github/scripts/install-deps.sh', '.github/scripts/install-mlgmp.sh', '.github/scripts/install-ppl.sh', '.github/patches/**') }}
